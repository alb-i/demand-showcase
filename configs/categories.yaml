# Product categories from the descriptions. Written by Claude after reading all 4,718
# canonical descriptions; edit freely. Rules are tried in order, the first match wins: a rule
# matches when one of its `any` phrases occurs as whole words (upper case, any run of spaces)
# and none of its `none` phrases does. Seasonal categories come first (a Christmas candle is
# Christmas), generic words (HOLDER, BOX, HEART) late. No match -> other. `overrides` fixes
# single products: {stock_code: category}.
rules:
- name: non_product
  label: Non-product lines (carriage, vouchers, ...)
  any: [PACKING CHARGE, HIGH RESOLUTION IMAGE, GIFT VOUCHER, POSTAGE, MANUAL, DISCOUNT, BANK CHARGES,
    SAMPLES, ADJUST, AMAZON FEE, DOTCOM, NEXT DAY CARRIAGE]
- name: christmas
  label: Christmas
  any: [CHRISTMAS, XMAS, ADVENT, REINDEER, SANTA, SNOWMAN, SNOWFLAKE, BAUBLE, BAUBLES, NOEL, NATIVITY,
    ROBIN, PUDDING, ELF, CRACKER, CRACKERS, MISTLETOE, HOLLY, STOCKING, TREE TOP, ANGEL, ANGELS, STAR
      T-LIGHT, NORDIC, PAPER CHAIN, GINGERBREAD, ICICLE, BLACKCHRISTMAS]
