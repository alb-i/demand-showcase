# E9: every tuning model on the test origins, both sets; run with
#   scripts/run_batch.py configs/batches/e9.yaml --origins test --final
# lgbm_total_q runs on the full set only: its forecasts do not depend on the set (trained on all
# products, no set-dependent intervals; identical on the tuning origins), the focus run is cut
# out of it by scripts/subset_run.py. Not here: the LightGBM tuning grid (lgbm_item_p12/p18/
# l15/l63), the item-target diagnostics (--target item), the category level (E3c), trivial.
