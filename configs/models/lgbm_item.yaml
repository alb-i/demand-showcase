# E4: global LightGBM on item demand (target scaled by the 13-week
# mean, Tweedie) + bulk part MA(52) per product; intervals from out-of-sample errors
name: lgbm
experiment: E4
target: item
bulk: {method: ma, window: 52}
rounds: 400
scale_weeks: 13
oos_weeks: 13
min_pool: 100
params: {tweedie_variance_power: 1.5, num_leaves: 31, learning_rate: 0.05, min_data_in_leaf: 50}
