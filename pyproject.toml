[project]
name = "retail"
version = "0.0.1"
description = "Demand forecasting and inventory optimisation on Online Retail II"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "openpyxl",
    "pyyaml",
    "python-dotenv",
    "scipy",
    "statsforecast",
    "lightgbm",
]

[project.optional-dependencies]
report = ["matplotlib"]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
